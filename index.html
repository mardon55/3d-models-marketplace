<!doctype html>
<html lang="<!-- figma:lang -->">
  <head>
    <!-- figma:head-start -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title><!-- figma:title --></title>
    <!-- figma:head-end -->
    <script>
      // Telegram WebApp SDK - async yuklanadi, mavjud bo'lmasa ham sahifa ishlaydi
      (function() {
        var s = document.createElement('script');
        s.src = 'https://telegram.org/js/telegram-web-app.js';
        s.async = true;
        s.onerror = function() {
          console.warn('Telegram WebApp SDK yuklanmadi - brauzer rejimida davom etilmoqda');
          window.Telegram = window.Telegram || {};
          window.Telegram.WebApp = window.Telegram.WebApp || {
            initData: '', initDataUnsafe: {}, version: '6.0',
            ready: function(){}, expand: function(){}, close: function(){},
            BackButton: { show: function(){}, hide: function(){}, onClick: function(){}, offClick: function(){}, isVisible: false }
          };
        };
        document.head.appendChild(s);
      })();
    </script>
  </head>
  <body>
    <!-- figma:body-start -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- figma:body-end -->
  </body>
</html>
